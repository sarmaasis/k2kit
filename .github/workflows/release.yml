name: Release

# Push a tag like v0.1.1 to publish that version to npm. Publishing uses npm trusted publishing
# (OIDC): no npm token is stored anywhere, and the package gets a provenance attestation.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment in the npm trusted-publisher settings. The environment only
    # accepts v* tags and requires a maintainer's approval before this job runs.
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # No registry-url: it writes a token placeholder into .npmrc, which can get in the way of OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # npm's own CLI (11.5.1+) does trusted publishing. prepublishOnly runs lint, typecheck,
      # tests, build and package checks first. No K2 credentials here: the live tests skip, so a
      # release never sends (billable) requests to a real stream, and the Cloudflare token is
      # never in the same process as the npm CLI.
      - name: Publish to npm
        run: npx --yes npm@latest publish --provenance --access public
      # Release notes: only this version's section of the changelog.
      - name: Create GitHub release
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v "( |$)" { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
